# Predeterminado offline: mock. La CLI puede seleccionar otro proveedor.
# OpenAI/Gemini requieren modelo explícito y clave de proceso; no se carga .env.
provider = "mock"
prompt = "v1_zero_shot"
mock_scenario = "fixed"
max_attempts = 2
max_query_chars = 4000
log_metrics = true
metrics_path = "data/metrics.jsonl"
